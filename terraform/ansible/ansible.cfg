[defaults]
# 项目目录
# 静态 inventory（由 ./inventory/generate_inventory.sh --write 生成）
# 资源变更（terraform apply/destroy）后重新执行 --write 刷新，命令无需再指定 -i
inventory = ./inventory/hosts.yml
roles_path = ./roles

# YAML 格式输出（ansible-core 2.13+ 内置）
callback_result_format = yaml
callbacks_enabled = ansible.builtin.profile_tasks

# SSH 配置 — 堡垒机跳板由 inventory 中的 ProxyCommand 处理
host_key_checking = False
timeout = 30
retry_files_enabled = False

# 连接配置
interpreter_python = auto_silent
pipelining = True

# 跳过已知主机检查（云环境 IP 会频繁变化）
[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=3

# 堡垒机跳板连接复用
control_path = /tmp/ansible-%%h-%%p-%%r
control_path_dir = /tmp
control_persist = 10m
